name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    # Unit tests must wait for lint so the test stage starts only after code quality checks pass.
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    # Build must wait for lint so artifacts are produced only from a quality-checked revision.
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  integration-tests:
    runs-on: ubuntu-latest
    # Integration tests require the build output created by the build job.
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/
      - run: npm run test:integration

  deploy-staging:
    runs-on: ubuntu-latest
    # Staging deployment requires both test stages to pass before deploying.
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - run: echo "Deploying to staging environment"

  deploy-production:
    runs-on: ubuntu-latest
    # Production deployment must follow a successful staging deployment.
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - run: echo "Deploying to production environment"

  notify:
    runs-on: ubuntu-latest
    # Notifications must run after every pipeline stage, including skipped or failed stages.
    needs: [lint, unit-tests, build, integration-tests, deploy-staging, deploy-production]
    if: always()
    timeout-minutes: 15
    steps:
      - run: echo "Pipeline notification sent"
